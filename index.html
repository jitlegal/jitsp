<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Jigsaw</title>
<meta name="description" content="Relaxing jigsaw puzzles from your own photos or painted pictures. Share puzzles with family by link or QR code.">
<meta name="theme-color" content="#24463c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<!-- Third-party code from CDN only, pinned + integrity-checked -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"
        integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous" defer></script>
</head>
<body>

<!-- ================= HOME ================= -->
<main id="home" class="screen">
  <header class="top">
    <h1 id="greet">Hello!</h1>
    <div class="top-btns">
      <button class="round" id="homeMusic" aria-label="Music">🎵</button>
      <button class="round" id="openSettings" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <section id="continueCard" class="card continue hidden">
    <img id="continueThumb" alt="">
    <div>
      <p class="big" id="continueText">Your puzzle is waiting</p>
      <button class="primary" id="continueBtn">Keep going ▶</button>
    </div>
  </section>

  <section class="card today">
    <div class="today-pic"><canvas id="todayPic" width="480" height="360" aria-hidden="true"></canvas></div>
    <div class="today-text">
      <p class="eyebrow">Today's puzzle</p>
      <h2 id="todayName">…</h2>
      <p id="streakText" class="muted"></p>
      <button class="primary" id="todayBtn">Start today's puzzle</button>
    </div>
  </section>

  <h2 class="section">Or pick a picture</h2>
  <section class="tiles">
    <button class="tile" id="photoBtn"><span>📷</span>My own photo</button>
    <button class="tile" id="paintBtn"><span>🎨</span>Painted pictures</button>
    <button class="tile" id="surpriseBtn"><span>🌍</span>Surprise photo</button>
    <button class="tile hidden" id="familyBtn"><span>👪</span>Family album</button>
    <button class="tile" id="albumBtn"><span>🖼️</span>My finished puzzles</button>
  </section>
  <p class="foot muted">Everything stays on this device. Music: public-domain records from 1900–1925, courtesy of the Internet Archive.</p>
  <input id="file" type="file" accept="image/*" hidden>
</main>

<!-- ================= PLAY ================= -->
<section id="play" class="screen hidden">
  <nav class="bar">
    <button id="homeBtn" aria-label="Home">🏠<span class="lbl"> Home</span></button>
    <button id="peekBtn" aria-pressed="false">👀<span class="lbl"> Show picture</span></button>
    <button id="tidyBtn">🧹<span class="lbl"> Tidy</span></button>
    <button id="helpBtn" class="gold">💡<span class="lbl"> Help me</span></button>
    <button id="playMusic" aria-label="Music">🎵</button>
    <button id="shareNow" aria-label="Send to family">💌</button>
    <span id="count" aria-live="polite"></span>
  </nav>
  <canvas id="cv"></canvas>
  <img id="thumb" alt="The finished picture. Tap to show it faintly on the board.">
  <div id="tip" class="tip hidden">Tap a piece, then tap where it goes — or drag it.</div>
</section>

<!-- ================= DIALOGS ================= -->
<div id="dlg" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="sheet" tabindex="-1">
    <button class="close" id="dlgClose" aria-label="Close">✕</button>
    <div id="dlgBody"></div>
  </div>
</div>
<div id="toast" class="toast hidden" role="status"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
