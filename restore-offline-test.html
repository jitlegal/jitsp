// 3-minute track through the real Worker (as the app does)
{ const L = SR * 180, long = new Float32Array(L); for (let i = 0; i < L; i++) long[i] = noisyM[i % noisyM.length];

{ const MB = 500000, mk = v => { const a = new Int16Array(MB); a.fill(v); return a; };

{ const cl = y => +corr(y.subarray(SR * 0.6, SR * 3.9), music.subarray(SR * 0.6, SR * 3.9)).toFixed(4), ab = {};

// ---------- pictures ----------
